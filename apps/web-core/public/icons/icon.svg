<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)" stroke="#334155" stroke-width="2" />

  <!-- Mirror Outer Ring -->
  <circle cx="96" cy="96" r="64" fill="none" stroke="url(#glowGrad)" stroke-width="6" stroke-dasharray="8,4" />

  <!-- Mirror Glass Inner -->
  <circle cx="96" cy="96" r="52" fill="#0f172a" stroke="#10b981" stroke-width="2" />

  <!-- Friendly Eyes & Smiling Sun Icon -->
  <circle cx="80" cy="92" r="7" fill="#f8fafc" />
  <circle cx="80" cy="92" r="3.5" fill="#090d16" />

  <circle cx="112" cy="92" r="7" fill="#f8fafc" />
  <circle cx="112" cy="92" r="3.5" fill="#090d16" />

  <!-- Smile -->
  <path d="M 82 108 Q 96 120 110 108" fill="none" stroke="#34d399" stroke-width="3.5" stroke-linecap="round" />

  <!-- Star / Sprout on Top -->
  <text x="96" y="46" font-size="20" text-anchor="middle">🌱</text>
</svg>
